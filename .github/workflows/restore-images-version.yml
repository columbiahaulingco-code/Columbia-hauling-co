name: Restore Image Card Version

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore homepage with image cards
        run: cp index-ultra.html index.html
      - name: Commit restored image card homepage
        run: |
          git config user.name "actions"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Restore homepage image cards"
          git push
