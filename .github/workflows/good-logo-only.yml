name: Good Homepage Logo Only
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: base64 -d assets/logo.webp.b64 > assets/logo.webp
      - run: cp index-ultra.html index.html
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('</style>', '.realLogoMini{width:52px;height:52px;border-radius:14px;background:#fff;object-fit:contain;padding:3px;box-shadow:0 14px 30px rgba(0,0,0,.28);display:block}\n@media(max-width:650px){.realLogoMini{width:52px;height:52px}.brand span:last-child{display:none}}\n</style>')
          s=s.replace('<span class="mark"><span>CH</span></span>','<img class="realLogoMini" src="assets/logo.webp" alt="Columbia Hauling Co. logo">')
          p.write_text(s)
          PY
      - run: |
          git config user.name actions
          git config user.email actions@github.com
          git add index.html assets/logo.webp
          git diff --cached --quiet || git commit -m "Use real logo in good homepage"
          git push
