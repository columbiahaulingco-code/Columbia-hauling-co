name: Put Back Dark Homepage

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp index-ultra.html index.html
      - run: |
          git config user.name "actions"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Put back dark homepage"
          git push
