name: Install Speed Insights

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-faq-update.yml

permissions:
  contents: write

jobs:
  speed-insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Speed Insights script to HTML pages
        run: |
          python3 <<'PY'
          from pathlib import Path

          speed_script = '<script defer src="/_vercel/speed-insights/script.js"></script>'
          analytics_script = '<script defer src="/_vercel/insights/script.js"></script>'

          changed = False
          for path in Path('.').glob('*.html'):
            html = path.read_text()
            original = html
            if speed_script not in html:
              html = html.replace('</body>', speed_script + '\n</body>') if '</body>' in html else html + speed_script
            if analytics_script not in html:
              html = html.replace('</body>', analytics_script + '\n</body>') if '</body>' in html else html + analytics_script
            if html != original:
              path.write_text(html)
              changed = True

          if not changed:
            print('Speed Insights already installed')
          PY
      - name: Commit Speed Insights install
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.html
          git commit -m "Install Vercel Speed Insights" || exit 0
          git push
