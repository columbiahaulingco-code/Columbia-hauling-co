name: Update homepage links

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-faq-update.yml

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add clickable locations and images
        run: |
          python3 <<'PY'
          from pathlib import Path
          from html import escape
          import re

          html = Path('index.html').read_text()

          # Make service images/cards clickable by wrapping each service card in a link to the quote form.
          html = html.replace('<article class="card"><div class="pic p1"></div><h3>Garage & Home Cleanouts</h3>', '<a class="card" href="#quote"><div class="pic p1"></div><h3>Garage & Home Cleanouts</h3>')
          html = html.replace('</p></article><article class="card"><div class="pic p2"></div><h3>Furniture Removal</h3>', '</p></a><a class="card" href="#quote"><div class="pic p2"></div><h3>Furniture Removal</h3>')
          html = html.replace('</p></article><article class="card"><div class="pic p3"></div><h3>Yard Debris Hauling</h3>', '</p></a><a class="card" href="#quote"><div class="pic p3"></div><h3>Yard Debris Hauling</h3>')
          html = html.replace('</p></article><article class="card"><div class="pic p4"></div><h3>Construction Debris</h3>', '</p></a><a class="card" href="#quote"><div class="pic p4"></div><h3>Construction Debris</h3>')
          html = html.replace('</p></article><article class="card"><div class="pic p5"></div><h3>Appliance Removal</h3>', '</p></a><a class="card" href="#quote"><div class="pic p5"></div><h3>Appliance Removal</h3>')
          html = html.replace('</p></article><article class="card"><div class="pic p6"></div><h3>Rental & Business Cleanouts</h3>', '</p></a><a class="card" href="#quote"><div class="pic p6"></div><h3>Rental & Business Cleanouts</h3>')
          html = html.replace('</p></article></div></div></section>', '</p></a></div></div></section>', 1)

          # Make service area list larger and clickable.
          locations = [
            ('Vancouver, WA','junk-removal-vancouver-wa.html'),('Portland, OR','junk-removal-portland-or.html'),
            ('Camas, WA','junk-removal-camas-wa.html'),('Washougal, WA','junk-removal-washougal-wa.html'),
            ('Battle Ground, WA','junk-removal-battle-ground-wa.html'),('Ridgefield, WA','junk-removal-ridgefield-wa.html'),
            ('Salmon Creek, WA','junk-removal-salmon-creek-wa.html'),('Hazel Dell, WA','junk-removal-hazel-dell-wa.html'),
            ('Orchards, WA','junk-removal-orchards-wa.html'),('Brush Prairie, WA','junk-removal-brush-prairie-wa.html'),
            ('Felida, WA','junk-removal-felida-wa.html'),('Gresham, OR','junk-removal-gresham-or.html'),
            ('Beaverton, OR','junk-removal-beaverton-or.html'),('Happy Valley, OR','junk-removal-happy-valley-or.html')
          ]
          area_html = '<div class="areaList">' + ''.join(f'<a href="/{url}">{escape(name)}</a>' for name,url in locations) + '</div>'
          html = re.sub(r'<div class="areaList">.*?</div></div></section>', area_html + '</div></section>', html, count=1, flags=re.S)

          # Add CSS for clickable areas if missing.
          css = '.areaList a{background:#fff;border:1px solid var(--darkline);border-radius:18px;padding:18px;font-weight:950;box-shadow:0 12px 34px rgba(7,24,39,.08);display:block}.card{color:inherit;text-decoration:none}'
          if '.areaList a{' not in html:
            html = html.replace('</style>', css + '</style>')

          Path('index.html').write_text(html)

          # Generate local landing pages for all locations.
          template = '''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Junk Removal in {city} | Columbia Hauling Co.</title><meta name="description" content="Junk removal in {city}. Text photos to Columbia Hauling Co. for furniture removal, cleanouts, appliances, yard debris, and hauling."><style>body{{margin:0;font-family:system-ui;color:#102033;line-height:1.55;background:#f4efe4}}.wrap{{width:min(1050px,calc(100% - 32px));margin:auto}}.hero{{background:#050b12;color:white;padding:70px 0}}a{{color:inherit}}h1{{font-size:clamp(2.7rem,7vw,5.8rem);line-height:.88;letter-spacing:-.07em}}p{{color:#475569}}.hero p{{color:rgba(255,255,255,.75);font-size:1.1rem}}.btn{{display:inline-block;background:#20b15a;color:white;text-decoration:none;padding:14px 20px;border-radius:999px;font-weight:900;margin:8px 8px 0 0}}.section{{padding:56px 0}}.grid{{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}}.card{{background:white;border-radius:22px;padding:22px;border:1px solid rgba(7,24,39,.12);box-shadow:0 14px 44px rgba(7,24,39,.08)}}@media(max-width:800px){{.grid{{grid-template-columns:1fr}}}}</style></head><body><section class="hero"><div class="wrap"><a href="/">← Back to home</a><h1>Junk removal in {city}.</h1><p>Columbia Hauling Co. helps homeowners, renters, landlords, and small businesses in {city} clear out junk fast. Text photos for the quickest quote.</p><a class="btn" href="sms:19713366379">Text Photos for Quote</a><a class="btn" href="tel:19713366379">Call 971-336-6379</a></div></section><section class="section"><div class="wrap"><h2>What we haul in {city}</h2><div class="grid"><div class="card"><h3>Furniture Removal</h3><p>Couches, mattresses, dressers, tables, chairs, shelves, and bulky items.</p></div><div class="card"><h3>Garage & Rental Cleanouts</h3><p>Garage junk, move-out piles, storage unit junk, and landlord cleanups.</p></div><div class="card"><h3>Yard & Small Debris</h3><p>Yard debris, appliances, small remodel debris, and cleanup piles.</p></div></div><a class="btn" href="/faq.html">View FAQs</a></div></section></body></html>'''
          for city, url in locations:
            Path(url).write_text(template.format(city=escape(city)))
          PY
      - name: Commit location and image updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html *.html
          git commit -m "Add clickable locations and service images" || exit 0
          git push
