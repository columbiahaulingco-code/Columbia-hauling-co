name: Apply FAQ update

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-faq-update.yml

permissions:
  contents: write

jobs:
  update-faq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shorten homepage FAQ
        run: |
          python3 <<'PY'
          from pathlib import Path
          from html import escape

          path = Path('index.html')
          html = path.read_text()
          start = html.index('<section class="section"><div class="container"><div class="heading"><span class="label">FAQ</span>')
          end = html.index('<section class="final">', start)

          qa = [
            ('How much does junk removal cost?', 'Pricing depends on load size, weight, labor, access, and disposal costs. Text photos to 971-336-6379 for the fastest quote.'),
            ('Can you give me a quote from photos?', 'Yes. Send a few clear photos, your city, where the junk is located, and when you want it picked up.'),
            ('What items do you take?', 'We usually haul furniture, mattresses, appliances, yard debris, garage junk, rental cleanouts, and small construction debris.'),
            ('What items do you not take?', 'Some items may not be accepted, including chemicals, paint, fuel, oil, asbestos, food waste, moldy items, and items with bugs.'),
            ('Do you offer same-day pickup?', 'Sometimes. It depends on route availability, job size, dump hours, and how fast you approve the quote.'),
            ('Do I need to move everything outside?', 'No. We can remove items from inside, garages, upstairs areas, and outside piles. Access can affect price.'),
            ('Do you load everything?', 'Yes. We do the loading. You do not need to help.'),
            ('What areas do you service?', 'We serve Vancouver WA, Portland OR, Camas, Washougal, Battle Ground, and nearby areas.'),
          ]
          items = ''.join(f'<details class="faq"><summary>{escape(q)}</summary><p>{escape(a)}</p></details>' for q, a in qa)
          new = '<section class="section"><div class="container"><div class="heading"><span class="label">FAQ</span><h2>Quick answers before you book.</h2><p>No giant wall of questions. Here are the ones people actually care about first.</p></div><div class="faqList">' + items + '</div><div class="actions" style="margin-top:24px"><a class="btn darkBtn" href="/faq.html">View All FAQs</a><a class="btn primary" href="sms:19713366379">Text Photos for Quote</a></div></div></section>\n    '
          path.write_text(html[:start] + new + html[end:])

          full = '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Junk Removal FAQ | Columbia Hauling Co.</title><meta name="description" content="Common junk removal questions for Columbia Hauling Co."><style>body{font-family:system-ui;margin:0;color:#102033;background:#f4efe4;line-height:1.55}.wrap{width:min(950px,calc(100% - 32px));margin:auto;padding:48px 0}.top{background:#050b12;color:white;padding:28px 0}.top a{color:#a7f3c4}h1{font-size:clamp(2.4rem,7vw,5rem);line-height:.9;letter-spacing:-.06em}.card{background:white;border:1px solid rgba(7,24,39,.12);border-radius:22px;padding:18px 22px;margin:12px 0;box-shadow:0 14px 44px rgba(7,24,39,.08)}summary{font-weight:900;cursor:pointer}p{color:#475569}.btn{display:inline-block;background:#20b15a;color:white;padding:14px 20px;border-radius:999px;text-decoration:none;font-weight:900;margin-top:18px}</style></head><body><div class="top"><div class="wrap"><a href="/">Back to home</a><h1>Junk Removal FAQ</h1><p>Full answers about pricing, pickup, items, scheduling, and disposal.</p><a class="btn" href="sms:19713366379">Text Photos for Quote</a></div></div><main class="wrap">'
          for q,a in qa:
              full += f'<details class="card"><summary>{escape(q)}</summary><p>{escape(a)}</p></details>'
          full += '<details class="card"><summary>Do you recycle or donate usable items?</summary><p>When possible, usable items may be donated or recycled instead of dumped.</p></details><details class="card"><summary>Where does the junk go?</summary><p>Junk goes to the proper disposal, recycling, or donation location depending on what it is.</p></details><details class="card"><summary>Do you accept cash, card, Venmo, Zelle, or check?</summary><p>Payment options can vary by job. Ask when you book and we will confirm.</p></details></main></body></html>'
          Path('faq.html').write_text(full)
          PY
      - name: Commit FAQ layout update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html faq.html
          git commit -m "Shorten homepage FAQ and add FAQ page" || exit 0
          git push
