name: Apply Real Logo Homepage

on:
  push:
    paths:
      - 'index-real-logo.html'
      - 'assets/logo.webp.b64'
      - '.github/workflows/apply-real-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decode real logo asset
        run: base64 -d assets/logo.webp.b64 > assets/logo.webp

      - name: Replace homepage with real-logo version
        run: cp index-real-logo.html index.html

      - name: Commit homepage and logo update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/logo.webp
          if git diff --cached --quiet; then
            echo "No homepage changes to commit."
          else
            git commit -m "Apply homepage with real logo"
            git push
          fi
